# secret-scan — stop hardcoded credentials before they are merged or deployed.
#
# Job 1 (deploy-package): the SAME gate predeploy.js runs on every `firebase deploy` (scripts/cicd/secret-scan.js:
#   the functions upload, tracked + untracked, firebase.json ignore rules) plus its tests. Catches a secret at PR
#   time instead of at deploy time.
# Job 2 (gitleaks): gitleaks' full rule set over the commits a PR / push ADDS — including files outside functions/
#   that never get deployed but are still published (this repo is public). Pinned binary, checksum-verified,
#   output redacted. Only new commits are scanned on purpose: credentials already in history must be ROTATED
#   (rescanning old commits would fail every run without making anything safer).
#
# Exceptions: deploy-package → .secretscan-allow.json (exact file+rule+sha256, reviewed);
#             gitleaks → .gitleaksignore fingerprints (reviewed). No blanket allowlists.
name: secret-scan

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scanner tests (fake credentials only)
        run: node --test scripts/cicd/secret-scan.test.js

      - name: Scan the functions deploy package
        run: node scripts/cicd/secret-scan.js

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to compute the commit range

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
          ./gitleaks version

      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="${PR_BASE}..${PR_HEAD}"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$ZERO" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            # new branch, force-push or manual run: everything not already on development
            RANGE="origin/development..${PUSH_AFTER}"
          fi
          echo "gitleaks range: $RANGE ($(git rev-list --count "$RANGE") commits)"
          # --redact: values never appear in logs. Exit code 1 on any finding fails the job.
          ./gitleaks git --log-opts="$RANGE" --redact --no-banner --verbose --exit-code 1 .
