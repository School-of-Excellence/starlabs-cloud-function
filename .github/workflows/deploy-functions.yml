# deploy-functions — deploy Cloud Functions from GitHub Actions.
#
# Postmark server tokens (POSTMARK_STARLABS_V1..V4, _TEST) live in Cloud Secret Manager on each Firebase
# project and are bound to functions with `defineSecret` (see functions/components/service.js). Nothing
# about them is injected here — rotate a token with:
#   firebase functions:secrets:set POSTMARK_STARLABS_V1 --project <project>
# and redeploy the functions that bind it.
#
#   push to development            → starlabs-test
#   "Run workflow" button          → any project (dropdown), optionally a subset of functions
#
# Required repository secrets:
#   FIREBASE_SERVICE_ACCOUNT   — JSON key of a service account allowed to deploy functions on every target
#                                project (also needs Secret Manager Admin to grant the runtime SA access)
#   CONSOLE_INGEST_TOKEN       — (already present) lets postdeploy.js record the deploy
name: deploy-functions

on:
  push:
    branches: [development]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
    inputs:
      project:
        description: 'Firebase project to deploy to'
        type: choice
        default: starlabs-test
        options:
          - starlabs-test
          - launch-your-legacy-development
          - fir-sample-aae4a
      only:
        description: 'Optional comma-separated function names (empty = all functions)'
        type: string
        default: ''

concurrency:
  group: deploy-functions-${{ github.event.inputs.project || 'starlabs-test' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROJECT: ${{ github.event.inputs.project || 'starlabs-test' }}
      ONLY: ${{ github.event.inputs.only || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The predeploy loop-guard (scripts/cicd/predeploy.js) boots the functions emulator, which needs Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}                              # predeploy.js requires `gh auth status`
          CONSOLE_INGEST_TOKEN: ${{ secrets.CONSOLE_INGEST_TOKEN }}  # postdeploy.js deploy recording
        run: |
          if [ -n "$ONLY" ]; then
            TARGET="functions:$(echo "$ONLY" | sed 's/ //g; s/,/,functions:/g')"
          else
            TARGET="functions"
          fi
          echo "Deploying --only $TARGET to $PROJECT"
          firebase deploy --only "$TARGET" --project "$PROJECT" --non-interactive
